<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-label="FlowGuard quickstart demo: legitimate sends allowed, SSN exfiltration attempts blocked">
<rect x="0" y="0" width="760" height="362" rx="10" fill="#0d1117"/>
<rect x="0" y="0" width="760" height="40" rx="10" fill="#161b22"/>
<rect x="0" y="30" width="760" height="10" fill="#161b22"/>
<circle cx="22" cy="20" r="6" fill="#ff5f56"/>
<circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="20" r="6" fill="#27c93f"/>
<text x="380.0" y="25" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e" text-anchor="middle">quickstart.py</text>
<rect x="0.5" y="0.5" width="759" height="361" rx="10" fill="none" stroke="#30363d"/>
<text x="22" y="73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#79c0ff" xml:space="preserve">$ python examples/quickstart.py</text>
<text x="22" y="121" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e" xml:space="preserve" opacity="0">Legitimate use<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0786;0.0786;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#3fb950" xml:space="preserve" opacity="0">  ALLOWED   name + department → partner<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1386;0.1386;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#3fb950" xml:space="preserve" opacity="0">  ALLOWED   email → partner (CONFIDENTIAL ok)<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1986;0.1986;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e" xml:space="preserve" opacity="0">The agent tries to leak the SSN<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2586;0.2586;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#f85149" xml:space="preserve" opacity="0">  BLOCKED   verbatim → partner<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3186;0.3186;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#f85149" xml:space="preserve" opacity="0">  BLOCKED   base64 → partner<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3786;0.3786;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="289" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#f85149" xml:space="preserve" opacity="0">  BLOCKED   hex → unknown host<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4386;0.4386;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#3fb950" xml:space="preserve" opacity="0">  ALLOWED   fragment 1 of 2 (harmless alone)<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4986;0.4986;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
<text x="22" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#f85149" xml:space="preserve" opacity="0">  BLOCKED   fragment 2 of 2 completes it<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5586;0.5586;1" dur="7.0s" begin="0s" repeatCount="indefinite"/></text>
</svg>